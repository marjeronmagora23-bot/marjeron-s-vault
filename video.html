<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>🎥 Videos | Marjeron's Vault</title>

    <link rel="stylesheet" href="style.css">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap"
        rel="stylesheet">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
</head>

<body>

    <div id="particles"></div>

    <header>

        <nav class="navbar">

            <div class="logo">
                💾 Marjeron's Vault
            </div>

            <ul>

                <li>
                    <a href="index.html">
                        <i class="fa-solid fa-house"></i>
                        Home
                    </a>
                </li>

                <li>
                    <a href="dashboard.html">
                        <i class="fa-solid fa-lock"></i>
                        Vault
                    </a>
                </li>

                <li>
                    <a href="gallery.html">
                        <i class="fa-solid fa-images"></i>
                        Gallery
                    </a>
                </li>

            </ul>

        </nav>

    </header>


    <main class="videos-page">

        <div class="videos-header">

            <p class="dashboard-label">
                🎥 VIDEO ARCHIVE
            </p>

            <h1>My Videos</h1>

            <p>
                Moments captured in motion.
            </p>

        </div>


        <!-- VIDEO PLAYER -->

        <div class="memory-video-card">

            <div class="memory-video">

                <video
                    id="memoryVideo"
                    controls
                    playsinline
                    preload="metadata">

                    <source src="video1.mp4" type="video/mp4">

                    Your browser does not support video playback.

                </video>


                <!-- VIDEO BUTTONS -->

                <div class="video-actions">

                    <!-- LIKE -->

                    <button type="button" id="likeVideo">

                        <i class="fa-solid fa-heart"></i>

                        <span>0</span>

                    </button>


                    <!-- COMMENTS -->

                    <button type="button" id="commentVideo">

                        <i class="fa-solid fa-comment"></i>

                        <span>0</span>

                    </button>


                    <!-- SHARE -->

                    <button type="button" id="shareVideo">

                        <i class="fa-solid fa-share"></i>

                        <span>Share</span>

                    </button>

                </div>


                <!-- VIDEO INFORMATION -->

                <div class="video-caption">

                    <h3>
                        My First Memory
                    </h3>

                    <p>
                        🎥 A memory worth keeping forever.
                    </p>

                </div>


                <!-- COMMENT BOX -->

                <div id="commentBox" class="comment-box">

                    <div class="comment-header">

                        <h3>
                            💬 Comments
                        </h3>

                        <button
                            type="button"
                            id="closeComments">

                            ✕

                        </button>

                    </div>


                    <div
                        id="commentsList"
                        class="comments-list">

                        <p class="no-comments">
                            No comments yet.
                        </p>

                    </div>


                    <div class="comment-input">

                        <input
                            type="text"
                            id="commentInput"
                            placeholder="Write a comment..."
                            maxlength="200"
                        >

                        <button
                            type="button"
                            id="sendComment">

                            <i class="fa-solid fa-paper-plane"></i>

                        </button>

                    </div>

                </div>

            </div>

        </div>

    </main>


    <footer>

        <p>
            💾 Marjeron's Vault
        </p>

        <p>
            Every video has a story.
        </p>

    </footer>


    <script src="script.js"></script>

<script type="module">

    // =========================
    // FIREBASE
    // =========================

    import { initializeApp }
        from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

    import {
        getFirestore,
        doc,
        getDoc,
        setDoc
    } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";

    import {
        getAuth,
        signInAnonymously
    } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";


    // =========================
    // FIREBASE CONFIG
    // =========================

    const firebaseConfig = {
        apiKey: "AIzaSyCGCqg8NjUfhVFyXJh5ohH3T9a2pW5ctzI",
        authDomain: "marjeron-portfolio.firebaseapp.com",
        databaseURL: "https://marjeron-portfolio-default-rtdb.firebaseio.com",
        projectId: "marjeron-portfolio",
        storageBucket: "marjeron-portfolio.firebasestorage.app",
        messagingSenderId: "203019659206",
        appId: "1:203019659206:web:fee5781c524f1119efb4c7",
        measurementId: "G-BB4NXL53YK"
    };


    // =========================
    // INITIALIZE FIREBASE
    // =========================

    const app = initializeApp(firebaseConfig);

    const db = getFirestore(app);

    const auth = getAuth(app);


    console.log("🔥 Firebase connected!");


    // =========================
    // ANONYMOUS LOGIN
    // =========================

    signInAnonymously(auth)
        .then(() => {

            console.log("👤 Anonymous user connected");

            setupLikeSystem();

        })
        .catch((error) => {

            console.error(
                "Authentication error:",
                error
            );

        });


    // =========================
    // LIKE SYSTEM
    // =========================

    async function setupLikeSystem() {

        const likeButton =
            document.getElementById("likeVideo");

        if (!likeButton) return;


        const likeCount =
            likeButton.querySelector("span");


        const user = auth.currentUser;

        if (!user) return;


        const likeRef = doc(
            db,
            "videos",
            "video1",
            "likes",
            user.uid
        );


        // Check if this user already liked

        try {

            const likeSnapshot =
                await getDoc(likeRef);


            if (likeSnapshot.exists()) {

                likeButton.classList.add("liked");

                likeCount.textContent = "1";

            } else {

                likeCount.textContent = "0";

            }

        } catch (error) {

            console.error(
                "Could not load like:",
                error
            );

        }


        // Like / Unlike

        likeButton.addEventListener(
            "click",
            async function () {

                try {

                    const snapshot =
                        await getDoc(likeRef);


                    if (snapshot.exists()) {

                        // UNLIKE

                        await setDoc(
                            likeRef,
                            {
                                liked: false
                            }
                        );

                        likeButton.classList.remove(
                            "liked"
                        );

                        likeCount.textContent = "0";


                    } else {

                        // LIKE

                        await setDoc(
                            likeRef,
                            {
                                liked: true,
                                createdAt:
                                    new Date()
                            }
                        );

                        likeButton.classList.add(
                            "liked"
                        );

                        likeCount.textContent = "1";

                    }

                } catch (error) {

                    console.error(
                        "Like error:",
                        error
                    );

                }

            }
        );

    }


    // =========================
    // COMMENT BOX
    // =========================

    const commentButton =
        document.getElementById("commentVideo");

    const commentBox =
        document.getElementById("commentBox");

    const closeComments =
        document.getElementById("closeComments");


    if (commentButton && commentBox) {

        commentButton.addEventListener(
            "click",
            function () {

                commentBox.classList.toggle(
                    "active"
                );

            }
        );

    }


    if (closeComments && commentBox) {

        closeComments.addEventListener(
            "click",
            function () {

                commentBox.classList.remove(
                    "active"
                );

            }
        );

    }


    // =========================
    // LOCAL COMMENT DISPLAY
    // =========================

    const commentInput =
        document.getElementById("commentInput");

    const sendComment =
        document.getElementById("sendComment");

    const commentsList =
        document.getElementById("commentsList");


    if (
        sendComment &&
        commentInput &&
        commentsList
    ) {

        sendComment.addEventListener(
            "click",
            function () {

                const text =
                    commentInput.value.trim();


                if (text === "") {
                    return;
                }


                const comment =
                    document.createElement("div");


                comment.className =
                    "comment-item";


                const name =
                    document.createElement("strong");

                name.textContent =
                    "Guest";


                const message =
                    document.createElement("p");

                message.textContent =
                    text;


                comment.appendChild(name);

                comment.appendChild(message);


                const noComments =
                    commentsList.querySelector(
                        ".no-comments"
                    );


                if (noComments) {

                    noComments.remove();

                }


                commentsList.appendChild(
                    comment
                );


                commentInput.value = "";


                commentsList.scrollTop =
                    commentsList.scrollHeight;

            }
        );

    }


    // =========================
    // SHARE
    // =========================

    const shareButton =
        document.getElementById("shareVideo");


    if (shareButton) {

        shareButton.addEventListener(
            "click",
            async function () {

                try {

                    await navigator.clipboard.writeText(
                        window.location.href
                    );

                    alert(
                        "Video page link copied!"
                    );

                } catch (error) {

                    alert(
                        "Copy this page link to share the memory."
                    );

                }

            }
        );

    }

</script>

</body>

</html>
