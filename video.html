    signInAnonymously

                             /* =========================================
   LIKE SYSTEM - FIXED
========================================= */

async function initializeLike() {

    const likeButton = document.getElementById("likeVideo");
    const likeCount = document.getElementById("likeCount");

    if (!likeButton || !likeCount) {
        console.error("Like elements not found.");
        return;
    }

    const user = auth.currentUser;

    if (!user) {
        console.error("Firebase user not found.");
        return;
    }

    const videoRef = doc(
        db,
        "videos",
        "video1"
    );

    const userLikeRef = doc(
        db,
        "videos",
        "video1",
        "likes",
        user.uid
    );


    // =========================================
    // LOAD CURRENT DATA
    // =========================================

    try {

        const videoSnapshot = await getDoc(videoRef);
        const userLikeSnapshot = await getDoc(userLikeRef);

        let totalLikes = 0;

        if (videoSnapshot.exists()) {

            totalLikes =
                videoSnapshot.data().likes || 0;

        }

        likeCount.textContent = totalLikes;


        if (
            userLikeSnapshot.exists() &&
            userLikeSnapshot.data().liked === true
        ) {

            likeButton.classList.add("liked");

        } else {

            likeButton.classList.remove("liked");

        }

    } catch (error) {

        console.error(
            "Error loading likes:",
            error
        );

    }


    // =========================================
    // LIKE / UNLIKE
    // =========================================

    likeButton.addEventListener(
        "click",
        async function () {

            if (likeButton.disabled) {
                return;
            }

            likeButton.disabled = true;

            try {

                const result = await runTransaction(
                    db,
                    async (transaction) => {

                        const videoSnapshot =
                            await transaction.get(videoRef);

                        const userLikeSnapshot =
                            await transaction.get(userLikeRef);


                        let currentLikes = 0;

                        if (videoSnapshot.exists()) {

                            currentLikes =
                                Number(
                                    videoSnapshot.data().likes || 0
                                );

                        }


                        const alreadyLiked =
                            userLikeSnapshot.exists() &&
                            userLikeSnapshot.data().liked === true;


                        // =========================
                        // UNLIKE
                        // =========================

                        if (alreadyLiked) {

                            const newLikes =
                                Math.max(
                                    0,
                                    currentLikes - 1
                                );


                            transaction.set(
                                videoRef,
                                {
                                    likes: newLikes
                                },
                                {
                                    merge: true
                                }
                            );


                            transaction.set(
                                userLikeRef,
                                {
                                    liked: false
                                },
                                {
                                    merge: true
                                }
                            );


                            return {
                                liked: false,
                                likes: newLikes
                            };

                        }


                        // =========================
                        // LIKE
                        // =========================

                        const newLikes =
                            currentLikes + 1;


                        transaction.set(
                            videoRef,
                            {
                                likes: newLikes
                            },
                            {
                                merge: true
                            }
                        );


                        transaction.set(
                            userLikeRef,
                            {
                                liked: true
                            },
                            {
                                merge: true
                            }
                        );


                        return {
                            liked: true,
                            likes: newLikes
                        };

                    }
                );


                // =================================
                // UPDATE SCREEN ONLY AFTER FIREBASE
                // SUCCESSFULLY SAVES
                // =================================

                likeCount.textContent =
                    result.likes;


                if (result.liked) {

                    likeButton.classList.add(
                        "liked"
                    );

                } else {

                    likeButton.classList.remove(
                        "liked"
                    );

                }


                console.log(
                    result.liked
                        ? "❤️ Like saved"
                        : "💔 Unlike saved"
                );


            } catch (error) {

                console.error(
                    "LIKE ERROR:",
                    error
                );


                alert(
                    "Unable to save your like. Please try again."
                );

            }


            likeButton.disabled = false;

        }
    );

}
const commentButton =
    document.getElementById(
        "commentVideo"
    );


const commentBox =
    document.getElementById(
        "commentBox"
    );


const closeComments =
    document.getElementById(
        "closeComments"
    );


if (
    commentButton &&
    commentBox
) {

    commentButton.addEventListener(
        "click",
        () => {

            commentBox.classList.toggle(
                "active"
            );

        }
    );

}


if (
    closeComments &&
    commentBox
) {

    closeComments.addEventListener(
        "click",
        () => {

            commentBox.classList.remove(
                "active"
            );

        }
    );

}



/* =========================================
   COMMENTS
========================================= */

const commentInput =
    document.getElementById(
        "commentInput"
    );


const sendComment =
    document.getElementById(
        "sendComment"
    );


const commentsList =
    document.getElementById(
        "commentsList"
    );


if (
    sendComment &&
    commentInput &&
    commentsList
) {

    sendComment.addEventListener(
        "click",
        () => {

            const text =
                commentInput.value.trim();


            if (!text) {

                return;

            }


            const comment =
                document.createElement(
                    "div"
                );


            comment.className =
                "comment-item";


            const name =
                document.createElement(
                    "strong"
                );


            name.textContent =
                "Guest";


            const message =
                document.createElement(
                    "p"
                );


            message.textContent =
                text;


            comment.appendChild(
                name
            );


            comment.appendChild(
                message
            );


            const noComments =
                commentsList.querySelector(
                    ".no-comments"
                );


            if (noComments) {

                noComments.remove();

            }


            commentsList.appendChild(
                comment
            );


            commentInput.value =
                "";


            commentsList.scrollTop =
                commentsList.scrollHeight;

        }
    );

}



/* =========================================
   SHARE
========================================= */

const shareButton =
    document.getElementById(
        "shareVideo"
    );


if (shareButton) {

    shareButton.addEventListener(
        "click",
        async () => {

            try {

                if (
                    navigator.share
                ) {

                    await navigator.share({

                        title:
                            "My First Memory",

                        text:
                            "🎥 A memory worth keeping forever.",

                        url:
                            window.location.href

                    });

                }

                else {

                    await navigator.clipboard.writeText(
                        window.location.href
                    );


                    alert(
                        "Video link copied!"
                    );

                }

            }

            catch (error) {

                console.log(
                    "Share cancelled."
                );

            }

        }
    );

}

</script>
