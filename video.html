<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>🎥 Videos | Marjeron's Vault</title>

    <link rel="stylesheet" href="style.css">

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap"
        rel="stylesheet">

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
</head>

<body>

<div id="particles"></div>


<!-- =========================
     NAVIGATION
========================= -->

<header>

    <nav class="navbar">

        <div class="logo">
            💾 Marjeron's Vault
        </div>

        <ul>

            <li>
                <a href="index.html">
                    <i class="fa-solid fa-house"></i>
                    Home
                </a>
            </li>

            <li>
                <a href="dashboard.html">
                    <i class="fa-solid fa-lock"></i>
                    Vault
                </a>
            </li>

            <li>
                <a href="gallery.html">
                    <i class="fa-solid fa-images"></i>
                    Gallery
                </a>
            </li>

        </ul>

    </nav>

</header>


<!-- =========================
     VIDEO PAGE
========================= -->

<main class="videos-page">

    <div class="videos-header">

        <p class="dashboard-label">
            🎥 VIDEO ARCHIVE
        </p>

        <h1>My Videos</h1>

        <p>
            Moments captured in motion.
        </p>

    </div>


    <!-- =========================
         VIDEO CARD
    ========================= -->

    <div class="memory-video-card">

        <div class="memory-video">


            <!-- VIDEO -->

            <video
                id="memoryVideo"
                controls
                playsinline
                preload="metadata">

                <source
                    src="video1.mp4"
                    type="video/mp4">

                Your browser does not support video playback.

            </video>


            <!-- =========================
                 ACTION BUTTONS
            ========================= -->

            <div class="video-actions">


                <!-- LIKE -->

                <button
                    type="button"
                    id="likeVideo">

                    <i class="fa-solid fa-heart"></i>

                    <span id="likeCount">
                        0
                    </span>

                </button>


                <!-- COMMENT -->

                <button
                    type="button"
                    id="commentVideo">

                    <i class="fa-solid fa-comment"></i>

                    <span id="commentCount">
                        0
                    </span>

                </button>


                <!-- SHARE -->

                <button
                    type="button"
                    id="shareVideo">

                    <i class="fa-solid fa-share"></i>

                    <span>
                        Share
                    </span>

                    <span id="shareCount">
                        0
                    </span>

                </button>

            </div>


            <!-- =========================
                 CAPTION
            ========================= -->

            <div class="video-caption">

                <h3>
                    My First Memory
                </h3>

                <p>
                    🎥 A memory worth keeping forever.
                </p>

            </div>


            <!-- =========================
                 COMMENT BOX
            ========================= -->

            <div
                id="commentBox"
                class="comment-box">


                <div class="comment-header">

                    <h3>
                        💬 Comments
                    </h3>

                    <button
                        type="button"
                        id="closeComments">

                        ✕

                    </button>

                </div>


                <!-- COMMENTS -->

                <div
                    id="commentsList"
                    class="comments-list">

                    <p class="no-comments">
                        Loading comments...
                    </p>

                </div>


                <!-- INPUT -->

                <div class="comment-input">

                    <input
                        type="text"
                        id="commentInput"
                        placeholder="Write a comment..."
                        maxlength="200"
                        autocomplete="off">

                    <button
                        type="button"
                        id="sendComment">

                        <i class="fa-solid fa-paper-plane"></i>

                    </button>

                </div>

            </div>

        </div>

    </div>

</main>


<!-- =========================
     FOOTER
========================= -->

<footer>

    <p>
        💾 Marjeron's Vault
    </p>

    <p>
        Every video has a story.
    </p>

</footer>



<!-- =====================================================
     FIREBASE
===================================================== -->

<script type="module">

/* =========================
   FIREBASE APP
========================= */

import {
    initializeApp
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";


import {
    getFirestore,
    doc,
    getDoc,
    setDoc,
    collection,
    addDoc,
    query,
    orderBy,
    onSnapshot,
    serverTimestamp,
    runTransaction
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


import {
    getAuth,
    signInAnonymously
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";



/* =====================================================
   FIREBASE CONFIG
===================================================== */

const firebaseConfig = {

    apiKey:
        "AIzaSyCGCqg8NjUfhVFyXJh5ohH3T9a2pW5ctzI",

    authDomain:
        "marjeron-portfolio.firebaseapp.com",

    databaseURL:
        "https://marjeron-portfolio-default-rtdb.firebaseio.com",

    projectId:
        "marjeron-portfolio",

    storageBucket:
        "marjeron-portfolio.firebasestorage.app",

    messagingSenderId:
        "203019659206",

    appId:
        "1:203019659206:web:fee5781c524f1119efb4c7",

    measurementId:
        "G-BB4NXL53YK"

};



/* =====================================================
   INITIALIZE FIREBASE
===================================================== */

const app =
    initializeApp(firebaseConfig);

const db =
    getFirestore(app);

const auth =
    getAuth(app);


console.log("🔥 Firebase initialized");



/* =====================================================
   VIDEO ID
===================================================== */

const VIDEO_ID = "video1";



/* =====================================================
   HTML ELEMENTS
===================================================== */

const likeButton =
    document.getElementById("likeVideo");

const likeCount =
    document.getElementById("likeCount");

const commentButton =
    document.getElementById("commentVideo");

const commentCount =
    document.getElementById("commentCount");

const commentBox =
    document.getElementById("commentBox");

const closeComments =
    document.getElementById("closeComments");

const commentInput =
    document.getElementById("commentInput");

const sendComment =
    document.getElementById("sendComment");

const commentsList =
    document.getElementById("commentsList");

const shareButton =
    document.getElementById("shareVideo");

const shareCount =
    document.getElementById("shareCount");



/* =====================================================
   FIRESTORE REFERENCES
===================================================== */

const videoRef =
    doc(
        db,
        "videos",
        VIDEO_ID
    );


/* =====================================================
   COMMENTS
===================================================== */

const commentsRef =
    collection(
        db,
        "videos",
        VIDEO_ID,
        "comments"
    );



/* =====================================================
   START ANONYMOUS LOGIN
===================================================== */

signInAnonymously(auth)

.then(async () => {

    console.log(
        "👤 Anonymous user connected:",
        auth.currentUser.uid
    );


    await createVideoIfNeeded();

    await loadVideoData();

    startCommentsListener();

})


.catch((error) => {

    console.error(
        "❌ Firebase authentication error:",
        error
    );

    alert(
        "Firebase login failed. Check Firebase Authentication settings."
    );

});



/* =====================================================
   CREATE VIDEO DOCUMENT IF IT DOESN'T EXIST
===================================================== */

async function createVideoIfNeeded() {

    try {

        const snapshot =
            await getDoc(videoRef);


        if (!snapshot.exists()) {

            await setDoc(
                videoRef,
                {
                    title:
                        "My First Memory",

                    description:
                        "🎥 A memory worth keeping forever.",

                    videoUrl:
                        "video1.mp4",

                    likes:
                        0,

                    shares:
                        0,

                    createdAt:
                        serverTimestamp()
                }
            );


            console.log(
                "🎥 Video document created"
            );

        }

    }

    catch (error) {

        console.error(
            "Error creating video:",
            error
        );

    }

}



/* =====================================================
   LOAD LIKE + SHARE COUNTS
===================================================== */

async function loadVideoData() {

    try {

        const snapshot =
            await getDoc(videoRef);


        if (!snapshot.exists()) {
            return;
        }


        const data =
            snapshot.data();


        likeCount.textContent =
            Number(data.likes || 0);


        shareCount.textContent =
            Number(data.shares || 0);


        /*
         * Check whether THIS anonymous user
         * already liked the video.
         */

        const user =
            auth.currentUser;


        if (user) {

            const userLikeRef =
                doc(
                    db,
                    "videos",
                    VIDEO_ID,
                    "likes",
                    user.uid
                );


            const userLikeSnapshot =
                await getDoc(userLikeRef);


            if (
                userLikeSnapshot.exists() &&
                userLikeSnapshot.data().liked === true
            ) {

                likeButton.classList.add(
                    "liked"
                );

            }

        }

    }

    catch (error) {

        console.error(
            "Error loading video:",
            error
        );

    }

}



/* =====================================================
   LIKE SYSTEM
===================================================== */

likeButton.addEventListener(
    "click",
    async () => {


        const user =
            auth.currentUser;


        if (!user) {

            alert(
                "Please wait for Firebase to connect."
            );

            return;

        }


        likeButton.disabled =
            true;


        const userLikeRef =
            doc(
                db,
                "videos",
                VIDEO_ID,
                "likes",
                user.uid
            );


        try {

            const result =
                await runTransaction(
                    db,
                    async (transaction) => {


                        const videoSnapshot =
                            await transaction.get(
                                videoRef
                            );


                        const userLikeSnapshot =
                            await transaction.get(
                                userLikeRef
                            );


                        let currentLikes =
                            0;


                        if (
                            videoSnapshot.exists()
                        ) {

                            currentLikes =
                                Number(
                                    videoSnapshot.data().likes || 0
                                );

                        }


                        const alreadyLiked =
                            userLikeSnapshot.exists() &&
                            userLikeSnapshot.data().liked === true;



                        /* =========================
                           UNLIKE
                        ========================= */

                        if (alreadyLiked) {

                            const newLikes =
                                Math.max(
                                    0,
                                    currentLikes - 1
                                );


                            transaction.set(
                                videoRef,
                                {
                                    likes:
                                        newLikes
                                },
                                {
                                    merge: true
                                }
                            );


                            transaction.set(
                                userLikeRef,
                                {
                                    liked:
                                        false
                                },
                                {
                                    merge: true
                                }
                            );


                            return {
                                liked:
                                    false,

                                likes:
                                    newLikes
                            };

                        }



                        /* =========================
                           LIKE
                        ========================= */

                        const newLikes =
                            currentLikes + 1;


                        transaction.set(
                            videoRef,
                            {
                                likes:
                                    newLikes
                            },
                            {
                                merge: true
                            }
                        );


                        transaction.set(
                            userLikeRef,
                            {
                                liked:
                                    true
                            },
                            {
                                merge: true
                            }
                        );


                        return {
                            liked:
                                true,

                            likes:
                                newLikes
                        };

                    }
                );



            /* =========================
               UPDATE SCREEN
            ========================= */

            likeCount.textContent =
                result.likes;


            if (result.liked) {

                likeButton.classList.add(
                    "liked"
                );

            }

            else {

                likeButton.classList.remove(
                    "liked"
                );

            }


            console.log(
                result.liked
                    ? "❤️ Like saved"
                    : "💔 Like removed"
            );

        }

        catch (error) {

            console.error(
                "❌ LIKE ERROR:",
                error
            );


            alert(
                "Unable to save your like. Please try again."
            );

        }


        likeButton.disabled =
            false;

    }
);



/* =====================================================
   OPEN COMMENTS
===================================================== */

commentButton.addEventListener(
    "click",
    () => {

        commentBox.classList.toggle(
            "active"
        );

    }
);



/* =====================================================
   CLOSE COMMENTS
===================================================== */

closeComments.addEventListener(
    "click",
    () => {

        commentBox.classList.remove(
            "active"
        );

    }
);



/* =====================================================
   LOAD COMMENTS IN REAL TIME
===================================================== */

function startCommentsListener() {


    const commentsQuery =
        query(
            commentsRef,
            orderBy(
                "createdAt",
                "asc"
            )
        );


    onSnapshot(
        commentsQuery,

        (snapshot) => {


            commentsList.innerHTML =
                "";


            commentCount.textContent =
                snapshot.size;


            if (snapshot.empty) {

                commentsList.innerHTML = `
                    <p class="no-comments">
                        No comments yet.
                    </p>
                `;

                return;

            }


            snapshot.forEach(
                (commentDoc) => {


                    const data =
                        commentDoc.data();


                    const comment =
                        document.createElement(
                            "div"
                        );


                    comment.className =
                        "comment-item";


                    const name =
                        document.createElement(
                            "strong"
                        );


                    name.textContent =
                        "Guest";


                    const message =
                        document.createElement(
                            "p"
                        );


                    message.textContent =
                        data.text || "";


                    comment.appendChild(
                        name
                    );


                    comment.appendChild(
                        message
                    );


                    commentsList.appendChild(
                        comment
                    );

                }
            );


            commentsList.scrollTop =
                commentsList.scrollHeight;

        },

        (error) => {

            console.error(
                "❌ Comment listener error:",
                error
            );

            commentsList.innerHTML = `
                <p>
                    Unable to load comments.
                </p>
            `;

        }
    );

}



/* =====================================================
   SEND COMMENT
===================================================== */

sendComment.addEventListener(
    "click",
    async () => {


        const text =
            commentInput.value.trim();


        if (!text) {

            return;

        }


        sendComment.disabled =
            true;


        try {


            await addDoc(
                commentsRef,
                {

                    text:
                        text,

                    createdAt:
                        serverTimestamp(),

                    userId:
                        auth.currentUser
                            ? auth.currentUser.uid
                            : "guest"

                }
            );


            commentInput.value =
                "";


            console.log(
                "💬 Comment saved!"
            );

        }

        catch (error) {

            console.error(
                "❌ COMMENT ERROR:",
                error
            );


            alert(
                "Unable to save comment. Please try again."
            );

        }


        sendComment.disabled =
            false;

    }
);



/* =====================================================
   SEND COMMENT WITH ENTER
===================================================== */

commentInput.addEventListener(
    "keydown",
    (event) => {

        if (
            event.key === "Enter"
        ) {

            event.preventDefault();

            sendComment.click();

        }

    }
);



/* =====================================================
   SHARE SYSTEM
===================================================== */

shareButton.addEventListener(
    "click",
    async () => {


        try {


            /*
             * First share/copy the link.
             */

            if (
                navigator.share
            ) {

                await navigator.share({

                    title:
                        "My First Memory",

                    text:
                        "🎥 A memory worth keeping forever.",

                    url:
                        window.location.href

                });

            }

            else {

                await navigator.clipboard.writeText(
                    window.location.href
                );

                alert(
                    "Video link copied!"
                );

            }



            /*
             * Count the share only after
             * the share action succeeds.
             */

            await runTransaction(
                db,
                async (transaction) => {


                    const snapshot =
                        await transaction.get(
                            videoRef
                        );


                    let currentShares =
                        0;


                    if (
                        snapshot.exists()
                    ) {

                        currentShares =
                            Number(
                                snapshot.data().shares || 0
                            );

                    }


                    const newShares =
                        currentShares + 1;


                    transaction.set(
                        videoRef,
                        {
                            shares:
                                newShares
                        },
                        {
                            merge: true
                        }
                    );


                    return newShares;

                }
            );


            /*
             * Reload the number.
             */

            const updated =
                await getDoc(
                    videoRef
                );


            if (
                updated.exists()
            ) {

                shareCount.textContent =
                    Number(
                        updated.data().shares || 0
                    );

            }


        }

        catch (error) {

            /*
             * User cancelling the share
             * is NOT treated as an error.
             */

            console.log(
                "Share cancelled or unavailable.",
                error
            );

        }

    }
);



/* =====================================================
   CONSOLE
===================================================== */

console.log(
    "🎥 Marjeron's Vault video system loaded!"
);

</script>

</body>
</html>
