<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>🎥 Videos | Marjeron's Vault</title>

    <link rel="stylesheet" href="style.css">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap"
        rel="stylesheet">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
</head>

<body>

    <div id="particles"></div>

    <header>

        <nav class="navbar">

            <div class="logo">
                💾 Marjeron's Vault
            </div>

            <ul>

                <li>
                    <a href="index.html">
                        <i class="fa-solid fa-house"></i>
                        Home
                    </a>
                </li>

                <li>
                    <a href="dashboard.html">
                        <i class="fa-solid fa-lock"></i>
                        Vault
                    </a>
                </li>

                <li>
                    <a href="gallery.html">
                        <i class="fa-solid fa-images"></i>
                        Gallery
                    </a>
                </li>

            </ul>

        </nav>

    </header>


    <main class="videos-page">

        <div class="videos-header">

            <p class="dashboard-label">
                🎥 VIDEO ARCHIVE
            </p>

            <h1>My Videos</h1>

            <p>
                Moments captured in motion.
            </p>

        </div>


        <!-- VIDEO PLAYER -->

        <div class="memory-video-card">

            <div class="memory-video">

                <video
                    id="memoryVideo"
                    controls
                    playsinline
                    preload="metadata">

                    <source src="video1.mp4" type="video/mp4">

                    Your browser does not support video playback.

                </video>


                <!-- Right-side buttons -->

                <div class="video-actions">

                    <button type="button" id="likeVideo">
                        <i class="fa-solid fa-heart"></i>
                        <span>0</span>
                    </button>

                    <button type="button">
                        <i class="fa-solid fa-comment"></i>
                        <span>0</span>
                    </button>

                    <button type="button" id="shareVideo">
                        <i class="fa-solid fa-share"></i>
                        <span>Share</span>
                    </button>

                </div>


                <!-- Video information -->

                <div class="video-caption">

                    <h3>My First Memory</h3>

                    <p>
                        🎥 A memory worth keeping forever.
                    </p>

                </div>

            </div>

        </div>

    </main>


    <footer>

        <p>💾 Marjeron's Vault</p>

        <p>Every video has a story.</p>

    </footer>


    <script src="script.js"></script>

    <script>

        // Like button

        const likeButton = document.getElementById("likeVideo");

        if (likeButton) {

            let likes = 0;

            likeButton.addEventListener("click", function () {

                likes++;

                this.classList.add("liked");

                this.querySelector("span").textContent = likes;

            });

        }


        // Share button

        const shareButton = document.getElementById("shareVideo");

        if (shareButton) {

            shareButton.addEventListener("click", async function () {

                try {

                    await navigator.clipboard.writeText(
                        window.location.href
                    );

                    alert("Video page link copied!");

                } catch (error) {

                    alert("Copy this page link to share the memory.");

                }

            });

        }

    </script>

</body>

</html>
