<!DOCTYPE html>

<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

<body>

    <div id="particles"></div>

    <header>

        <nav class="navbar">

            <div class="logo">
                💾 Marjeron's Vault
            </div>

            <ul>

                <li>
                    <a href="index.html">
                        <i class="fa-solid fa-house"></i>
                        Home
                    </a>
                </li>

                <li>
                    <a href="dashboard.html">
                        <i class="fa-solid fa-lock"></i>
                        Vault
                    </a>
                </li>

                <li>
                    <a href="gallery.html">
                        <i class="fa-solid fa-images"></i>
                        Gallery
                    </a>
                </li>

            </ul>

        </nav>

    </header>


    <main class="videos-page">

        <div class="videos-header">

            <p class="dashboard-label">
                🎥 VIDEO ARCHIVE
            </p>

            <h1>My Videos</h1>

            <p>
                Moments captured in motion.
            </p>

        </div>


        <!-- VIDEO PLAYER -->

        <div class="memory-video-card">

            <div class="memory-video">

                <video
                    id="memoryVideo"
                    controls
                    playsinline
                    preload="metadata">

                    <source src="video1.mp4" type="video/mp4">

                    Your browser does not support video playback.

                </video>


                <!-- VIDEO BUTTONS -->

                <div class="video-actions">

                    <!-- LIKE -->

                    <button type="button" id="likeVideo">

                        <i class="fa-solid fa-heart"></i>

                        <span>0</span>

                    </button>


                    <!-- COMMENTS -->

                    <button type="button" id="commentVideo">

                        <i class="fa-solid fa-comment"></i>

                        <span>0</span>

                    </button>


                    <!-- SHARE -->

                    <button type="button" id="shareVideo">

                        <i class="fa-solid fa-share"></i>

                        <span>Share</span>

                    </button>

                </div>


                <!-- VIDEO INFORMATION -->

                <div class="video-caption">

                    <h3>
                        My First Memory
                    </h3>

                    <p>
                        🎥 A memory worth keeping forever.
                    </p>

                </div>


                <!-- COMMENT BOX -->

                <div id="commentBox" class="comment-box">

                    <div class="comment-header">

                        <h3>
                            💬 Comments
                        </h3>

                        <button
                            type="button"
                            id="closeComments">

                            ✕

                        </button>

                    </div>


                    <div
                        id="commentsList"
                        class="comments-list">

                        <p class="no-comments">
                            No comments yet.
                        </p>

                    </div>


                    <div class="comment-input">

                        <input
                            type="text"
                            id="commentInput"
                            placeholder="Write a comment..."
                            maxlength="200"
                        >

                        <button
                            type="button"
                            id="sendComment">

                            <i class="fa-solid fa-paper-plane"></i>

                        </button>

                    </div>

                </div>

            </div>

        </div>

    </main>


    <footer>

        <p>
            💾 Marjeron's Vault
        </p>

        <p>
            Every video has a story.
        </p>

    </footer>


    <script src="script.js"></script>

    <script>

        // =========================
        // LIKE BUTTON
        // =========================

        const likeButton =
            document.getElementById("likeVideo");

        if (likeButton) {

            let liked = false;

            let likes = 0;

            likeButton.addEventListener(
                "click",
                function () {

                    liked = !liked;

                    if (liked) {

                        likes = 1;

                        this.classList.add("liked");

                    } else {

                        likes = 0;

                        this.classList.remove("liked");

                    }

                    this.querySelector("span")
                        .textContent = likes;

                }
            );

        }


        // =========================
        // COMMENT BOX
        // =========================

        const commentButton =
            document.getElementById("commentVideo");

        const commentBox =
            document.getElementById("commentBox");

        const closeComments =
            document.getElementById("closeComments");


        if (commentButton && commentBox) {

            commentButton.addEventListener(
                "click",
                function () {

                    commentBox.classList.toggle("active");

                }
            );

        }


        if (closeComments && commentBox) {

            closeComments.addEventListener(
                "click",
                function () {

                    commentBox.classList.remove("active");

                }
            );

        }

// =========================
// SEND COMMENT
// =========================

const commentInput =
    document.getElementById("commentInput");

const sendComment =
    document.getElementById("sendComment");

const commentsList =
    document.getElementById("commentsList");


if (sendComment && commentInput && commentsList) {

    sendComment.addEventListener("click", function () {

        const text = commentInput.value.trim();

        if (text === "") {
            return;
        }

        const comment = document.createElement("div");

        comment.className = "comment-item";

        comment.innerHTML = `
            <strong>Guest</strong>
            <p>${text}</p>
        `;

        const noComments =
            commentsList.querySelector(".no-comments");

        if (noComments) {
            noComments.remove();
        }

        commentsList.appendChild(comment);

        commentInput.value = "";

        commentsList.scrollTop =
            commentsList.scrollHeight;

    });

}
        // =========================
        // SHARE BUTTON
        // =========================

        const shareButton =
            document.getElementById("shareVideo");


        if (shareButton) {

            shareButton.addEventListener(
                "click",
                async function () {

                    try {

                        await navigator.clipboard.writeText(
                            window.location.href
                        );

                        alert(
                            "Video page link copied!"
                        );

                    } catch (error) {

                        alert(
                            "Copy this page link to share the memory."
                        );

                    }

                }
            );

        }

    </script>

</body>

</html>
