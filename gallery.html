
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>📸 Gallery | Marjeron's Vault</title>

    <link rel="stylesheet" href="style.css">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap"
        rel="stylesheet">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
</head>

<body>

    <div id="particles"></div>

    <header>

        <nav class="navbar">

            <div class="logo">
                💾 Marjeron's Vault
            </div>

            <ul>
                <li>
                    <a href="index.html">
                        <i class="fa-solid fa-house"></i>
                        Home
                    </a>
                </li>

                <li>
                    <a href="dashboard.html">
                        <i class="fa-solid fa-lock"></i>
                        Vault
                    </a>
                </li>
            </ul>

        </nav>

    </header>


    <main class="gallery-page">

        <div class="gallery-header">

            <p class="dashboard-label">
                📂 MEMORY ARCHIVE
            </p>

            <h1>My Gallery</h1>

            <p>
                A collection of moments worth keeping.
            </p>

        </div>


        <!-- Categories -->

        <div class="gallery-filters">

            <button class="filter-btn active" data-filter="all">
                All
            </button>

            <button class="filter-btn" data-filter="me">
                📸 Me
            </button>

            <button class="filter-btn" data-filter="friends">
                👥 Friends
            </button>

            <button class="filter-btn" data-filter="special">
                ❤️ Special Someone
            </button>

            <button class="filter-btn" data-filter="random">
                🌄 Random
            </button>

        </div>


        <!-- Gallery -->

        <div class="gallery-grid">


            <!-- PHOTO -->

            <div class="gallery-item" data-category="me">

                <img src="myphoto.jpg" alt="My photo">

                <div class="gallery-overlay">

                    <h3>Me</h3>

                    <p>A moment worth remembering.</p>

                </div>

            </div>


            <!-- FRIEND PHOTO -->

          <div class="gallery-item" data-category="friends">

    <img src="friend1.jpg" alt="Friend">

    <div class="gallery-overlay">

        <h3>Friend</h3>

        <p>A memory worth keeping.</p>

    </div>

</div>


            <!-- SPECIAL SOMEONE -->

            <div class="gallery-item" data-category="special">

    <img src="special1.jpg" alt="Special memory">

    <div class="gallery-overlay">

        <h3>Special Memory ❤️</h3>

        <p>A moment worth keeping forever.</p>

    </div>

</div>


            <!-- RANDOM -->

            <div class="gallery-item" data-category="random">

                <div class="empty-photo">

                    <i class="fa-solid fa-camera"></i>

                    <p>Add a random moment</p>

                </div>

            </div>


        </div>

    </main>


    <footer>

        <p>💾 Marjeron's Vault</p>

        <p>Every picture has a story.</p>

    </footer>


    <!-- Fullscreen Photo Viewer -->

<div id="photoViewer" class="photo-viewer">

    <button id="closeViewer" class="close-viewer">
        ✕
    </button>

    <img id="viewerImage" src="" alt="Fullscreen photo">

</div>


<!-- Gallery JavaScript -->

<script>

document.addEventListener("DOMContentLoaded", function () {

    // =========================
    // GALLERY FILTERS
    // =========================

    const filterButtons = document.querySelectorAll(".filter-btn");
    const galleryItems = document.querySelectorAll(".gallery-item");

    filterButtons.forEach(function (button) {

        button.addEventListener("click", function () {

            const filter = button.getAttribute("data-filter");

            // Active button
            filterButtons.forEach(function (btn) {
                btn.classList.remove("active");
            });

            button.classList.add("active");

            // Show / hide gallery items
            galleryItems.forEach(function (item) {

                const category = item.getAttribute("data-category");

                if (filter === "all" || category === filter) {

                    item.style.display = "";

                } else {

                    item.style.display = "none";

                }

            });

        });

    });


    // =========================
    // FULLSCREEN PHOTO VIEWER
    // =========================

    const photoViewer = document.getElementById("photoViewer");
    const viewerImage = document.getElementById("viewerImage");
    const closeViewer = document.getElementById("closeViewer");

    const galleryImages = document.querySelectorAll(".gallery-item img");


    galleryImages.forEach(function (image) {

        image.addEventListener("click", function () {

            viewerImage.src = image.src;

            photoViewer.classList.add("active");

        });

    });


    // Close button

    closeViewer.addEventListener("click", function () {

        photoViewer.classList.remove("active");

    });


    // Click outside photo

    photoViewer.addEventListener("click", function (event) {

        if (event.target === photoViewer) {

            photoViewer.classList.remove("active");

        }

    });


    // ESC key

    document.addEventListener("keydown", function (event) {

        if (event.key === "Escape") {

            photoViewer.classList.remove("active");

        }

    });

});

</script>

</body>
</html>
